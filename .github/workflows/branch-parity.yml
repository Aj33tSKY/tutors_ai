name: Branch parity

# GitHub's merge-method settings are repository-wide, so it cannot require a
# merge commit for promotions into main while still allowing squash merges into
# develop. This catches the mistake instead: it runs after every push to either
# long-lived branch and fails if main and develop have diverged.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-parity
  cancel-in-progress: true

jobs:
  parity:
    name: main and develop have not diverged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ancestry cannot be computed from a shallow clone.
          fetch-depth: 0
      - name: Compare main and develop
        run: |
          git fetch --quiet origin main develop
          bash scripts/ci/verify-branch-parity.sh origin/main origin/develop
