name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the commit being released
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate tutors_dev and deploy tutors-dev
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      # The Supabase CLI reads both of these from the environment, so every
      # remote command below is authenticated without secrets in argv.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_CLI_VERSION: 60.0.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Limit manual staging deployments to develop
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [ "$DEPLOY_REF" != "refs/heads/develop" ]; then
            echo "::error::Staging can only be deployed from develop."
            exit 1
          fi

      # Every fail-closed check runs before the job contacts tutors_dev at all.
      - name: Require an explicitly confirmed staging baseline
        env:
          STAGING_MIGRATIONS_BASELINED: ${{ vars.STAGING_MIGRATIONS_BASELINED }}
          SUPABASE_BASELINE_VERSION: ${{ vars.SUPABASE_BASELINE_VERSION }}
        run: |
          if [ "$STAGING_MIGRATIONS_BASELINED" != "true" ]; then
            echo "::error::Reconcile tutors_dev migration history first, then set the staging environment variable STAGING_MIGRATIONS_BASELINED=true."
            exit 1
          fi
          if [ -z "$SUPABASE_BASELINE_VERSION" ]; then
            echo "::error::Set SUPABASE_BASELINE_VERSION to the last migration verified as already present in tutors_dev."
            exit 1
          fi

      - name: Require the credentials the release needs
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID VERCEL_TOKEN VERCEL_PROJECT_ID VERCEL_ORG_ID; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required staging secrets/variables:$missing"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install the Supabase CLI pinned in package.json
        run: npm ci

      - name: Link Supabase CLI to tutors_dev
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify remote migration history
        env:
          SUPABASE_BASELINE_VERSION: ${{ vars.SUPABASE_BASELINE_VERSION }}
        run: |
          npx --no-install supabase migration list --linked --output-format json > "$RUNNER_TEMP/staging-migrations.json"
          node scripts/ci/verify-supabase-migration-history.mjs "$RUNNER_TEMP/staging-migrations.json"

      - name: Preview staging migrations
        run: npx --no-install supabase db push --linked --dry-run

      - name: Apply staging migrations
        id: migrate
        run: npx --no-install supabase db push --linked --yes

      - name: Report out-of-band schema drift
        # tutors_dev has taken direct SQL fixes before; this is where they surface.
        continue-on-error: true
        run: |
          if ! npx --no-install supabase db diff --linked > "$RUNNER_TEMP/drift.sql"; then
            echo "::warning::Could not compute the schema diff; skipping the drift report."
            exit 0
          fi
          if [ -s "$RUNNER_TEMP/drift.sql" ]; then
            echo "::warning::tutors_dev differs from the checked-in migrations — reconcile it into a migration."
            cat "$RUNNER_TEMP/drift.sql"
          else
            echo "No out-of-band schema drift detected."
          fi

      - name: Deploy to the stable staging project
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(npx --yes vercel@"$VERCEL_CLI_VERSION" deploy --prod --yes \
            --scope "$VERCEL_ORG_ID" \
            --project "$VERCEL_PROJECT_ID" \
            --token "$VERCEL_TOKEN")"
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke-check the release
        env:
          HEALTH_BASE_URL: ${{ vars.STAGING_URL || steps.deploy.outputs.url }}
        run: bash scripts/ci/smoke-check-deployment.sh "$HEALTH_BASE_URL"

      - name: Explain how to recover
        if: failure() && steps.migrate.outcome == 'success'
        run: |
          echo "::error::Migrations were applied to tutors_dev before this failure. The database is ahead of the running app."
          echo "Prefer a forward fix. To put the previous build back first: vercel rollback --scope <org> --token <token>"
