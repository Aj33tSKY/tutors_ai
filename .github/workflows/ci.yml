name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      migration_validation:
        description: >-
          "auto" validates only when the change could affect the result;
          "always" validates regardless. Production passes "always".
        type: string
        default: auto
  workflow_dispatch:

permissions:
  contents: read
  # Reading a pull request's changed files decides whether the database needs
  # validating on this run.
  pull-requests: read

concurrency:
  # The deploy workflows call this workflow to verify the exact commit they ship,
  # so key the group on the calling workflow too: a new push to a pull request
  # must never cancel the CI gate of an in-flight release.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Decide which checks this change can affect (scripts/ci/changed-scope.mjs). The job always runs and always reports, so
      # the required check never sits pending; the slow steps below are conditional. Releases and manual runs have no pull
      # request, so they get "unknown" and run everything.
      - name: Decide which checks this change needs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then changed="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"; else changed='*'; fi
          printf '%s\n' "$changed" | node scripts/ci/changed-scope.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.scope.outputs.code == 'true'
        run: npm ci
      - name: Lint
        if: steps.scope.outputs.code == 'true'
        run: npm run lint
      - name: Generate Next.js route types
        if: steps.scope.outputs.next == 'true'
        run: npx next typegen
      - name: Typecheck the legacy Next application
        if: steps.scope.outputs.next == 'true'
        run: npx tsc --noEmit
      - name: Typecheck the portable application
        if: steps.scope.outputs.code == 'true'
        run: npm run typecheck:portable
      - name: Test API contracts and authorization boundaries
        if: steps.scope.outputs.code == 'true'
        run: npm run test:portable
      - name: Build portable API, worker and static frontend
        if: steps.scope.outputs.code == 'true'
        run: npm run build:portable
      - name: Verify every bundle import is a declared runtime dependency
        if: steps.scope.outputs.code == 'true'
        run: node scripts/ci/verify-bundle-deps.mjs
      - name: Validate the Cloudflare static-assets adapter without deploying
        if: steps.scope.outputs.webdeploy == 'true'
        run: npm run check:web-deploy
        env:
          CLOUDFLARE_SEND_METRICS: "false"
      - name: Release-only scripts must at least load
        if: steps.scope.outputs.code == 'true'
        # They run only during a release, so a module-format or syntax error would otherwise surface mid-release
        # (grant-roles.ts once failed that way). Without its settings the script must stop with its own clear error.
        run: |
          out="$(npx --no-install tsx scripts/migration/grant-roles.mts 2>&1 || true)"
          echo "$out" | grep -q "are required" || { echo "$out"; echo "::error::grant-roles.mts did not start cleanly"; exit 1; }
      - name: Run the Worker in Cloudflare's runtime and check runtime-specific behaviour
        if: steps.scope.outputs.worker == 'true'
        # Node tests cannot catch runtime differences (Stripe's synchronous signature check failed only on Workers).
        run: |
          npm run build:edge-assets
          node scripts/ci/worker-smoke.mjs
        env:
          CLOUDFLARE_SEND_METRICS: "false"
      - name: Verify the standalone container runtime
        if: steps.scope.outputs.docker == 'true'
        run: |
          docker build -f infra/app/Dockerfile -t tutors-portable:ci .
          node scripts/migration/container-smoke.mjs tutors-portable:ci
      - name: Verify the web image (Caddy routing, caching, headers and API proxy)
        if: steps.scope.outputs.docker == 'true'
        run: |
          docker build -f infra/app/Dockerfile --target web -t tutors-web:ci .
          node scripts/migration/web-smoke.mjs tutors-web:ci tutors-portable:ci
      # The manifest is what the production parity check trusts, so it has to
      # keep matching the code or it quietly stops covering a variable.
      - name: Check the environment manifest matches the code
        if: steps.scope.outputs.code == 'true'
        run: node scripts/ci/verify-env-manifest.mjs
      - name: Build the legacy Next application
        if: steps.scope.outputs.next == 'true'
        # Placeholders only: this job never sees a real environment's secrets.
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_LIVEKIT_URL: wss://example.livekit.cloud
          LIVEKIT_API_KEY: ci-placeholder-livekit-key
          LIVEKIT_API_SECRET: ci-placeholder-livekit-secret
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          CRON_SECRET: ci-placeholder-cron-secret
          DEEPGRAM_API_KEY: ci-placeholder-deepgram-key

  workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Decide which checks this change can affect (scripts/ci/changed-scope.mjs). The job always runs and always reports, so
      # the required check never sits pending; the slow steps below are conditional. Releases and manual runs have no pull
      # request, so they get "unknown" and run everything.
      - name: Decide which checks this change needs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then changed="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"; else changed='*'; fi
          printf '%s\n' "$changed" | node scripts/ci/changed-scope.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.scope.outputs.workflows == 'true'
        run: npm ci
      # actionlint covers expression typos, bad needs references, unknown action
      # inputs, and shellcheck over every run block. Pinned by tag, and the
      # image ships the shellcheck it needs.
      - name: actionlint
        if: steps.scope.outputs.workflows == 'true'
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color
      # actionlint does not check that a reusable workflow's callers grant the
      # permissions it requests; GitHub only enforces that at run time, which is
      # how an unrunnable staging.yml once reached the default branch.
      - name: Verify reusable workflow permissions
        if: steps.scope.outputs.workflows == 'true'
        run: node scripts/ci/verify-workflow-permissions.mjs

  migrations:
    name: Validate migrations from a clean local database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The job always runs so that it always reports a result: a required check
      # that never runs leaves a pull request pending forever. What it *does* is
      # conditional instead, which costs a few seconds when there is nothing to
      # validate rather than a little over two minutes.
      - name: Decide whether the database needs validating
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.migration_validation || 'auto' }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          validate() {
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Production passes "always": that database is the one place a broken
          # migration is expensive, and its releases are rare and manual.
          if [ "$MODE" = "always" ]; then
            validate "Production release — validating migrations regardless of the diff."
          fi

          # Work out which files this run could have changed. Both branches ask
          # the API rather than git, so neither needs full history checked out.
          if [ "$EVENT" = "pull_request" ]; then
            changed="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          elif [ "$EVENT" = "push" ] && [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            changed="$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename' 2>/dev/null || echo "")"
            # A force-push or a rewritten history leaves nothing comparable.
            [ -z "$changed" ] && validate "Could not determine what changed — validating migrations."
          else
            validate "Cannot scope this event's changes — validating migrations."
          fi

          # Only the paths that can change this job's result. Dev helpers such as
          # supabase/*.mjs cannot, package-lock.json can because the Supabase CLI
          # is pinned there, and ci.yml can because it defines the job.
          if printf '%s\n' "$changed" | grep -qE '^(supabase/(migrations|tests)/|supabase/config\.toml$|apps/api/|apps/worker/|packages/|tests/portable/|scripts/migration/|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)'; then
            validate "Database, dependency or workflow changes detected — validating migrations."
          fi

          echo "needed=false" >> "$GITHUB_OUTPUT"
          echo "No database or dependency changes — skipped migration validation." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.needed == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.needed == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install the Supabase CLI pinned in package.json
        if: steps.scope.outputs.needed == 'true'
        run: npm ci
      - name: Install the browser for the authenticated migration smoke test
        if: steps.scope.outputs.needed == 'true'
        run: npx --no-install playwright install --with-deps chromium
      - name: Clean migrations, schema lint, RLS and real API integration
        if: steps.scope.outputs.needed == 'true'
        # The runner creates and cleans up only its own disposable stack. It
        # never reads .env.local and never links a hosted project.
        run: npm run test:portable:integration
