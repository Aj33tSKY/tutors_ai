name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      migration_validation:
        description: >-
          "auto" validates only when the change could affect the result;
          "always" validates regardless. Production passes "always".
        type: string
        default: auto
  workflow_dispatch:

permissions:
  contents: read
  # Reading a pull request's changed files decides whether the database needs
  # validating on this run.
  pull-requests: read

concurrency:
  # The deploy workflows call this workflow to verify the exact commit they ship,
  # so key the group on the calling workflow too: a new push to a pull request
  # must never cancel the CI gate of an in-flight release.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Generate Next.js route types
        run: npx next typegen
      - run: npx tsc --noEmit
      - name: Build the application
        # Placeholders only: this job never sees a real environment's secrets.
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_LIVEKIT_URL: wss://example.livekit.cloud
          LIVEKIT_API_KEY: ci-placeholder-livekit-key
          LIVEKIT_API_SECRET: ci-placeholder-livekit-secret
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          CRON_SECRET: ci-placeholder-cron-secret
          DEEPGRAM_API_KEY: ci-placeholder-deepgram-key

  workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # actionlint covers expression typos, bad needs references, unknown action
      # inputs, and shellcheck over every run block. Pinned by tag, and the
      # image ships the shellcheck it needs.
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color
      # actionlint does not check that a reusable workflow's callers grant the
      # permissions it requests; GitHub only enforces that at run time, which is
      # how an unrunnable staging.yml reached develop.
      - name: Verify reusable workflow permissions
        run: node scripts/ci/verify-workflow-permissions.mjs

  migrations:
    name: Validate migrations from a clean local database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The job always runs so that it always reports a result: a required check
      # that never runs leaves a pull request pending forever. What it *does* is
      # conditional instead, which costs a few seconds when there is nothing to
      # validate rather than a little over two minutes.
      - name: Decide whether the database needs validating
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.migration_validation || 'auto' }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          validate() {
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Production passes "always": that database is the one place a broken
          # migration is expensive, and its releases are rare and manual.
          if [ "$MODE" = "always" ]; then
            validate "Production release — validating migrations regardless of the diff."
          fi

          # Work out which files this run could have changed. Both branches ask
          # the API rather than git, so neither needs full history checked out.
          if [ "$EVENT" = "pull_request" ]; then
            changed="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          elif [ "$EVENT" = "push" ] && [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            changed="$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename' 2>/dev/null || echo "")"
            # A force-push or a rewritten history leaves nothing comparable.
            [ -z "$changed" ] && validate "Could not determine what changed — validating migrations."
          else
            validate "Cannot scope this event's changes — validating migrations."
          fi

          # Only the paths that can change this job's result. Dev helpers such as
          # supabase/*.mjs cannot, package-lock.json can because the Supabase CLI
          # is pinned there, and ci.yml can because it defines the job.
          if printf '%s\n' "$changed" | grep -qE '^(supabase/(migrations|tests)/|supabase/config\.toml$|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)'; then
            validate "Database, dependency or workflow changes detected — validating migrations."
          fi

          echo "needed=false" >> "$GITHUB_OUTPUT"
          echo "No database or dependency changes — skipped migration validation." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.needed == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.needed == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install the Supabase CLI pinned in package.json
        if: steps.scope.outputs.needed == 'true'
        run: npm ci
      - name: Start the local services migrations need
        # analytics/vector/studio and the function runtimes play no part in
        # applying SQL, and are the slowest and flakiest containers to boot.
        if: steps.scope.outputs.needed == 'true'
        run: npx --no-install supabase start -x analytics,vector,studio,imgproxy,inbucket,edge-runtime,functions,realtime
      - name: Apply every migration to an empty database
        # `supabase start` applies them once as a side effect; resetting asserts
        # the same thing deliberately and fails on the offending statement.
        if: steps.scope.outputs.needed == 'true'
        run: npx --no-install supabase db reset --local --no-seed
      - name: Lint the resulting schema
        if: steps.scope.outputs.needed == 'true'
        run: npx --no-install supabase db lint --local --level error --fail-on error
      - name: Run the RLS test suite
        if: steps.scope.outputs.needed == 'true'
        run: npx --no-install supabase test db --local
