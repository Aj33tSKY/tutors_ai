services:
  api:
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile
    environment:
      PORT: "3001"
      APP_WEB_ORIGIN: ${APP_WEB_ORIGIN:?Set the exact frontend origin}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the development Supabase URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set the public Supabase key}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:?Set the LiveKit websocket URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set the LiveKit API key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set the LiveKit API secret}
      R2_ENDPOINT: ${R2_ENDPOINT:?Set the API recording endpoint}
      R2_BUCKET: ${R2_BUCKET:?Set the API private recording bucket}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set the API recording key}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set the API recording secret}
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 3
    stop_grace_period: 35s
  worker:
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile
    command: ["node", "dist/worker.mjs"]
    environment:
      PORT: "3002"
      APP_JOBS_DATABASE_URL: ${APP_JOBS_DATABASE_URL:?Set the restricted runtime database URL}
      R2_ENDPOINT: ${R2_ENDPOINT:?Set the worker recording endpoint}
      R2_BUCKET: ${R2_BUCKET:?Set the worker private recording bucket}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set the worker recording key}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set the worker recording secret}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?Set the worker transcription key}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?Set the portable worker AI Gateway key}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 35s
  migrate-jobs:
    profiles: ["release"]
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile
    command: ["node", "dist/migrate-jobs.mjs"]
    environment:
      APP_JOBS_MIGRATION_DATABASE_URL: ${APP_JOBS_MIGRATION_DATABASE_URL:-}
