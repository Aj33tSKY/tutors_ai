# Production/staging stack for a single VPS: Caddy (TLS, static frontend, API proxy), the API and the
# worker. Supabase, R2 and LiveKit stay external. Images are pinned by digest through APP_IMAGE and
# WEB_IMAGE, which deploy.sh sets, so a release is exactly the artifact CI built and tested.
name: tutors
services:
  web:
    image: ${WEB_IMAGE:?Set by deploy.sh}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?The public hostname, for example app.example.com}
      API_UPSTREAM: api:3001
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: { api: { condition: service_healthy } }
    logging: &logging { driver: json-file, options: { max-size: "10m", max-file: "5" } }
  api:
    image: ${APP_IMAGE:?Set by deploy.sh}
    restart: unless-stopped
    env_file: [./env/api.env]
    environment: { PORT: "3001", APP_COMMIT_SHA: "${APP_COMMIT_SHA:?Set by deploy.sh}" }
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 35s
    logging: *logging
  worker:
    image: ${APP_IMAGE:?Set by deploy.sh}
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    env_file: [./env/worker.env]
    environment: { PORT: "3002", APP_COMMIT_SHA: "${APP_COMMIT_SHA:?Set by deploy.sh}" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Lets an in-flight job finish before the process stops; leases cover a hard kill.
    stop_grace_period: 40s
    logging: *logging
  # Explicit release operations, never started with the stack: `docker compose --profile release run --rm migrate-jobs`.
  migrate-jobs:
    profiles: ["release"]
    image: ${APP_IMAGE:?Set by deploy.sh}
    command: ["node", "dist/migrate-jobs.mjs"]
    env_file: [./env/release.env]
volumes:
  caddy_data:
  caddy_config:
